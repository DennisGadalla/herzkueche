name: Generate gallery thumbnails

on:
  push:
    branches: ["agent/professional-ui-pass"]
    paths:
      - ".github/workflows/generate-gallery-thumbnails.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate lightweight gallery thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source_root = Path("assets/img/galeries")
          thumb_root = source_root / "thumbs"
          count = 0

          for gallery in ("Buffets", "Herzkueche", "Dining"):
              for source in sorted((source_root / gallery).glob("img-*.jpg")):
                  destination = thumb_root / gallery / f"{source.stem}.webp"
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with Image.open(source) as image:
                      image = ImageOps.exif_transpose(image).convert("RGB")
                      thumb = ImageOps.fit(
                          image,
                          (720, 540),
                          method=Image.Resampling.LANCZOS,
                          centering=(0.5, 0.5),
                      )
                      thumb.save(destination, "WEBP", quality=76, method=6)
                  count += 1

          print(f"Generated {count} thumbnails")
          PY
      - name: Commit generated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/galeries/thumbs
          if git diff --cached --quiet; then
            echo "No thumbnail changes"
          else
            git commit -m "perf: generate lightweight gallery thumbnails"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
