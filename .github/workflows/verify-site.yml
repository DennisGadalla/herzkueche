name: Verify static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run structural and form tests
        run: python -m unittest discover -s tests -v
      - name: Run browser-behavior simulation
        run: node tests/site_polish_smoke.js
