name: Verify static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run structural and performance regressions
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check assets/js/main.js

      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser regression audits
        timeout-minutes: 6
        run: |
          python -m http.server 4173 >/tmp/herzkueche-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/visual_audit.js
          node tests/contact_form_audit.js
          node tests/mobile_gallery_audit.js

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: artifacts/visual
          if-no-files-found: ignore
